[build-system]
requires = ["uv_build>=0.11.25,<0.12"]
build-backend = "uv_build"

[project]
name = "pttoolbox"
version = "0.2.0"
description = "Toolbox for PyTorch."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Yasyrev Andrei", email = "a.yasyrev@gmail.com" },
]
classifiers = [
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "accelerate>=1.13.0",
    "numpy>=2.0.2",
    "pandas>=2.2.2",
    "pillow>=11.3.0",
    "pyarrow>=18.1.0",
    "pyyaml>=6.0.3",
    "requests>=2.32.5",
    "rich>=13.9.4",
    "safetensors>=0.7.0",
    "timm>=1.0.26",
    "torch>=2.10.0",
    "torchvision>=0.25.0",
]

[project.urls]
Homepage = "https://github.com/ayasyrev/pttoolbox"
Repository = "https://github.com/ayasyrev/pttoolbox"

[dependency-groups]
dev = [
    "pre-commit",
    "pytest",
    "pytest-cov",
    "ruff",
]

[tool.uv]
required-version = ">=0.11.25"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
